<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sandglass Life</title>
  <meta name="description" content="Sandglass Life plays the day back on your iPhone. Where you went, the walk or the drive, and one picture for each place.">
  <meta name="theme-color" content="#0e0c0a">
  <meta property="og:title" content="Sandglass Life">
  <meta property="og:description" content="Play the day back. A film of your day, on your iPhone.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sandglasslife.com/">
  <meta property="og:image" content="https://sandglasslife.com/days.jpg">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root {
      --theatre: #0e0c0a;
      --copper: #d46c35;
      --cream: #f6f1e8;
      --muted: rgba(246, 241, 232, 0.62);
      --line: rgba(246, 241, 232, 0.14);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; max-width: 100%; overflow-x: clip; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(720px 420px at 50% -40px, rgba(212, 108, 53, 0.28), transparent 58%),
        radial-gradient(980px 520px at 50% 72%, rgba(212, 108, 53, 0.09), transparent 62%),
        var(--theatre);
      color: var(--cream);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { width: min(1120px, calc(100% - 48px)); margin: 0 auto; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 26px 0 0;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand svg { width: 40px; height: 40px; display: block; flex: none; }
    .brand span {
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      font-size: 21px;
      letter-spacing: -0.02em;
    }
    .soon {
      margin: 0;
      color: var(--copper);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .soon-mobile { display: none; margin-top: 22px; }
    .hero {
      padding: 72px 0 8px;
      text-align: center;
    }
    .kicker {
      color: var(--copper);
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin: 0 0 18px;
    }
    h1 {
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
      font-weight: 500;
      font-size: clamp(34px, 10.4vw, 92px);
      line-height: 0.94;
      letter-spacing: -0.035em;
      margin: 0 auto 20px;
      max-width: 11em;
      text-wrap: balance;
    }
    .deck {
      font-size: 19px;
      color: var(--muted);
      max-width: 32em;
      margin: 0 auto;
      text-wrap: balance;
    }
    .stage {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px;
      align-items: start;
      width: 100%;
      min-width: 0;
      padding: 72px 0 8px;
    }
    figure { margin: 0; min-width: 0; max-width: 100%; }
    figure:nth-child(odd) { margin-top: 48px; }
    .phone {
      min-width: 0;
      max-width: 100%;
      contain: inline-size;
      padding: 8px;
      border-radius: 40px;
      background:
        linear-gradient(165deg, rgba(246, 241, 232, 0.28), transparent 26%),
        linear-gradient(180deg, #3c332b, #141210 46%, #090807);
      box-shadow:
        inset 0 0 0 1px rgba(246, 241, 232, 0.16),
        inset 0 1px 0 rgba(246, 241, 232, 0.22),
        0 24px 50px rgba(0, 0, 0, 0.38);
      overflow: hidden;
    }
    .phone img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 32px;
    }
    figcaption {
      margin-top: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .note {
      text-align: center;
      color: rgba(246, 241, 232, 0.42);
      font-size: 13px;
      margin: 28px 0 0;
    }
    footer {
      border-top: 1px solid var(--line);
      margin-top: 48px;
      padding: 22px 0 40px;
      color: var(--muted);
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }
    @media (max-width: 860px) {
      .wrap { width: min(1120px, calc(100% - 40px)); }
      .hero { padding-top: 48px; }
      h1 { font-size: clamp(34px, 10.6vw, 56px); }
      .deck { font-size: 17px; }
      .stage {
        grid-template-columns: minmax(0, 1fr);
        max-width: 420px;
        margin: 0 auto;
        gap: 40px;
        padding-top: 48px;
      }
      figure:nth-child(odd) { margin-top: 0; }
      header .soon { display: none; }
      .soon-mobile { display: block; }
      footer { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="14" fill="#f6f1e8"/>
          <path fill="#d46c35" d="M17 16.5h30a2.3 2.3 0 0 1 0 4.6h-30a2.3 2.3 0 0 1 0-4.6zM19.2 20.4h25.6C44.2 27 39.2 31.2 33.1 32.4L32 32.8l-1.1-.4C24.8 31.2 19.8 27 19.2 20.4zM30.9 33.2 32 32.8l1.1.4C39.2 34.6 44.2 38.8 44.8 47.6h-25.6C19.8 38.8 24.8 34.6 30.9 33.2zM17 46.9h30a2.3 2.3 0 0 1 0 4.6h-30a2.3 2.3 0 0 1 0-4.6z"/>
        </svg>
        <span>Sandglass Life</span>
      </div>
      <p class="soon">Coming to the App Store</p>
    </header>
    <section class="hero">
      <p class="kicker">For iPhone</p>
      <h1>Play the day back.</h1>
      <p class="deck">A short film of the day. Where you went, the walk or the drive, and one picture for each place.</p>
      <p class="soon soon-mobile">Coming to the App Store</p>
    </section>
    <div class="stage">
      <figure>
        <div class="phone">
          <img src="days.jpg" alt="The Days screen, with three sample days. Thursday runs from home to a bookshop, a drive, and a terrace.">
        </div>
        <figcaption>Days</figcaption>
      </figure>
      <figure>
        <div class="phone">
          <img src="stills.jpg" alt="The Stills tab on the iPhone, Tuesday September 29, with the home photograph and the next place.">
        </div>
        <figcaption>Stills</figcaption>
      </figure>
      <figure>
        <div class="phone">
          <img src="film.jpg" alt="Playback of a sample day, with the drive drawn across the city toward the water.">
        </div>
        <figcaption>Playback</figcaption>
      </figure>
    </div>
    <p class="note">Stills is a real day. Days and playback are a sample.</p>
    <footer>
      <span>Sandglass Life</span>
      <span>sandglasslife.com</span>
    </footer>
  </div>
</body>
</html>
